name: Update Vhostty

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vhostty
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update release version and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-vhostty.py
      - name: Commit update
        run: |
          if git diff --quiet -- Casks/vhostty.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vhostty.rb
          git commit -m "Update Vhostty release"
          git push
